[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatwechat"
version = "0.2.0"
description = "Offline, manual WeChat chat export workbench for Windows"
requires-python = ">=3.11"
dependencies = [
  "pywebview>=6.2,<7",
  "cryptography>=44",
  "zstandard>=0.23",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
chatwechat = "chatwechat.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["chatwechat*"]

[tool.setuptools.package-data]
chatwechat = ["web/*", "web/assets/*", "vendor/silk-wasm/*"]
