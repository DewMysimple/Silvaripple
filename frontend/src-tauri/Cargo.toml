[package]
name = "chatwechat-desktop"
version = "0.2.0"
description = "ChatWechat Tauri desktop shell"
authors = ["ChatWechat contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chatwechat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
